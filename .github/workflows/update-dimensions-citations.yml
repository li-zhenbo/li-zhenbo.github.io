name: Update Citations from Dimensions

on:
  schedule:
    - cron: "0 0 * * 1"  # Every Monday at 00:00 UTC (08:00 Beijing time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch citation counts from Dimensions
        id: fetch
        run: |
          python3 << 'PYEOF'
          import urllib.request, re, yaml, os

          # Papers to update: bib_key -> DOI
          papers = {
              "li2026quantitative": "10.1088/1402-4896/ae5134",
              "li2025global": "10.1016/j.ijnonlinmec.2025.105185",
              "li2024modified": "10.1016/j.ijnonlinmec.2024.104832",
              "li2024modified2": "10.1088/1402-4896/ad5066",
              "li2013generalized": "10.1016/j.jsv.2013.05.007",
              "li2014generalized": "10.1088/1674-1056/23/12/120501",
              "li2016predicting": "10.1007/s12346-015-0138-z",
              "li2019cosine": "10.13465/j.cnki.jvs.2019.22.023",
              "li2016generalized": "10.1007/s11071-015-2563-6",
              "li2022high": "10.1007/s42417-022-00446-7",
              "li2011generalized": "10.7498/aps.60.050508",
              "li2011generalized2": "10.1016/j.nonrwa.2011.03.009",
              "li2011parametric": "10.1016/j.cnsns.2010.10.027",
              # NOTE: li2013pade (力学学报 10.6052/0459-1879-12-277) is NOT in Dimensions
              # — it must be updated manually from CNKI (知网). Current: 31.
          }

          results = {}
          for key, doi in papers.items():
              url = f"https://badge.dimensions.ai/details/doi/{doi}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
                  # Extract count from badge image URL in the page
                  matches = re.findall(r'badge\?count=(\d+)', html)
                  if matches:
                      results[key] = int(matches[0])
                      print(f"{key}: {matches[0]} citations")
                  else:
                      print(f"{key}: could not extract citation count")
                      results[key] = -1
              except Exception as e:
                  print(f"{key}: error - {e}")
                  results[key] = -1

          # Read existing citations.yml
          with open("_data/citations.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f) or {}

          if "papers" not in data:
              data["papers"] = {}

          from datetime import date
          data["metadata"] = {"last_updated": date.today().isoformat()}

          for key, count in results.items():
              if count >= 0:
                  if key in data["papers"] and isinstance(data["papers"][key], dict):
                      data["papers"][key]["citations"] = count
                  else:
                      data["papers"][key] = {"citations": count}

          with open("_data/citations.yml", "w", encoding="utf-8") as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False, sort_keys=False)

          print("Updated _data/citations.yml")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml
          git diff --staged --quiet || (
            echo "Committing updated citation counts"
            git commit -m "Auto-update citation counts from Dimensions"
            git push
          )